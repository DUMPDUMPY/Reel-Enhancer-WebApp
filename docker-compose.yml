# Synology DSM Container Manager -> Project -> Create -> point at this folder.
# Open from your phone: http://<NAS-IP>:8000
# ./data and ./models must exist before the first start (they ship in the repo as empty folders).
# No `cpus:` limit: Container Manager on DSM doesn't support it; FFmpeg's CPU use is capped by CPU_THREADS.
services:
  whisper:
    build: ./docker/whisper
    image: reel-enhancer-whisper:latest
    container_name: reel-whisper
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri          # Intel iGPU (Vulkan), same as the Ollama container
    environment:
      - WHISPER_MODEL=ggml-large-v3-q5_0.bin   # or ggml-large-v3-turbo-q5_0.bin (faster, less accurate in Thai)
      - WHISPER_THREADS=4
    volumes:
      - ./models:/models
    mem_limit: 6g

  app:
    build: .
    image: reel-enhancer-app:latest
    container_name: reel-enhancer
    restart: unless-stopped
    depends_on:
      - whisper
    ports:
      - "8000:8000"
    devices:
      - /dev/dri:/dev/dri          # Intel iGPU (VAAPI) for FFmpeg
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - WHISPER_URL=http://whisper:8080
      - WHISPER_MODEL=ggml-large-v3-q5_0.bin   # keep the same as the whisper service
      # --- Cloud speech-to-text (optional): adds "elevenlabs:scribe_v2" to the model list ---
      - ELEVENLABS_API_KEY=
      # Default speech-to-text model. Empty = ElevenLabs when its key is set, else Whisper.
      - TRANSCRIBE_MODEL=
      # --- AI proofreading (optional): cloud API with a key, or local Ollama ---
      # Set a key to use that provider; the NAS then doesn't run any LLM itself.
      - ZAI_API_KEY=                 # Z.AI GLM  (models: glm-4.7-flash, glm-4.5-flash, ...)
      - TYPHOON_API_KEY=             # opentyphoon.ai (Thai): typhoon-v2.5-30b-a3b-instruct
      - OPENROUTER_API_KEY=          # with OPENROUTER_MODELS=model-a,model-b
      - GEMINI_API_KEY=
      # Any other OpenAI-compatible API: CUSTOM_LLM_BASE_URL / CUSTOM_LLM_API_KEY / CUSTOM_LLM_MODELS
      # Default model, e.g. zai:glm-4.7-flash. Empty = first provider that has a key, else Ollama.
      - PROOFREAD_MODEL=
      # Ollama runs in another project on this NAS and publishes port 11434.
      # Use the NAS IP instead (e.g. http://192.168.1.4:11434) if host-gateway doesn't work.
      # Leave OLLAMA_HOST empty to hide Ollama entirely.
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=gemma3:4b
      - RENDER_MODE=auto           # auto | vaapi | cpu
      - CPU_THREADS=4              # only used if rendering falls back to the CPU
      - JOB_RETENTION_HOURS=72
      - TZ=Asia/Bangkok
    volumes:
      - ./data:/data
      - ./models:/models:ro
    mem_limit: 4g
