<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>Reel Enhancer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>🎬 Reel Enhancer</h1>
  <div class="chips" id="chips"></div>
</header>

<main>
  <!-- Step 1: upload -->
  <section class="card" id="step-upload">
    <h2><span class="num">1</span> อัปโหลดคลิป</h2>
    <label class="file-pick">
      <input type="file" id="file" accept="video/*,.mp4,.mov,.m4v,.webm,.mkv">
      <span id="file-label">แตะเพื่อเลือกวิดีโอจากเครื่อง</span>
    </label>
    <label class="field">
      <span>ชื่อตัวละคร / คำเฉพาะ (ไม่บังคับ)</span>
      <textarea id="hint" rows="2" placeholder="เช่น กุ๊กไก่, เจ้าเหมียว, หมูจิ๋ว"></textarea>
    </label>
    <button class="btn primary" id="btn-upload" disabled>อัปโหลด</button>
    <div class="progress hidden" id="upload-progress"><div></div></div>
    <details class="recent" id="recent-box">
      <summary>งานล่าสุด</summary>
      <ul id="recent"></ul>
    </details>
  </section>

  <!-- Step 2: transcribe -->
  <section class="card hidden" id="step-transcribe">
    <h2><span class="num">2</span> ถอดเสียงสร้างซับ</h2>
    <div class="clip-info" id="clip-info"></div>
    <div class="row">
      <label class="field grow"><span>โมเดลถอดเสียง</span><select id="model"></select></label>
    </div>
    <label class="switch"><input type="checkbox" id="vad" checked><span>ตัดช่วงที่มีแต่เพลง/เงียบ (VAD)</span></label>
    <label class="switch"><input type="checkbox" id="proofread"><span>ให้ Ollama ช่วยตรวจคำผิด</span></label>
    <label class="field hidden" id="ollama-model-wrap"><span>โมเดล Ollama</span><select id="ollama-model"></select></label>
    <button class="btn primary" id="btn-transcribe">1. ถอดเสียงจับเวลา</button>
    <div class="task hidden" id="task-transcribe"><div class="progress"><div></div></div><p class="msg"></p></div>
  </section>

  <!-- Step 3: edit -->
  <section class="card hidden" id="step-edit">
    <h2><span class="num">3</span> ตรวจและแก้ซับ</h2>
    <div class="preview" id="preview">
      <video id="video" playsinline controls preload="metadata"></video>
      <div class="sub-overlay" id="overlay"><span></span></div>
    </div>

    <div class="suggestions hidden" id="suggestions">
      <div class="sg-head">
        <strong>🤖 Ollama แนะนำแก้คำ</strong>
        <button class="btn small" id="btn-accept-all">ยอมรับทั้งหมด</button>
      </div>
      <ul id="sg-list"></ul>
    </div>
    <p class="warn hidden" id="proofread-error"></p>

    <div class="cue-toolbar">
      <button class="btn small" id="btn-add-now">+ เพิ่มแคปชันที่เวลาปัจจุบัน</button>
      <button class="btn small ghost" id="btn-proofread">🤖 ตรวจคำผิด</button>
      <span class="save-state" id="save-state"></span>
    </div>
    <ol class="cues" id="cues"></ol>
    <p class="empty hidden" id="cues-empty">ยังไม่มีซับ กด "+ เพิ่มแคปชัน" เพื่อพิมพ์เองได้</p>

    <details class="style-box" open>
      <summary>🎨 สไตล์ซับและภาพ</summary>
      <div class="grid2">
        <label class="field"><span>ฟอนต์</span><select id="st-font"></select></label>
        <label class="field"><span>ขนาด <b id="st-size-v"></b></span><input type="range" id="st-size" min="40" max="130" step="2"></label>
        <label class="field"><span>สีตัวอักษร</span>
          <div class="swatches" data-target="color">
            <button data-v="#FFFFFF" style="--c:#fff"></button>
            <button data-v="#FFE600" style="--c:#ffe600"></button>
            <button data-v="#00F0FF" style="--c:#00f0ff"></button>
            <button data-v="#FF4FA3" style="--c:#ff4fa3"></button>
            <input type="color" id="st-color">
          </div>
        </label>
        <label class="field"><span>สีขอบ</span>
          <div class="swatches" data-target="outline_color">
            <button data-v="#000000" style="--c:#000"></button>
            <button data-v="#1A1A6E" style="--c:#1a1a6e"></button>
            <button data-v="#7A0000" style="--c:#7a0000"></button>
            <input type="color" id="st-outline-color">
          </div>
        </label>
        <label class="field"><span>ความหนาขอบ <b id="st-outline-v"></b></span><input type="range" id="st-outline" min="0" max="10" step="0.5"></label>
        <label class="field"><span>ระยะจากขอบล่าง <b id="st-margin-v"></b></span><input type="range" id="st-margin" min="80" max="900" step="10"></label>
      </div>
      <label class="switch"><input type="checkbox" id="st-box"><span>พื้นหลังกล่องทึบแทนขอบ</span></label>
      <div class="grid2">
        <label class="field"><span>คลิปไม่ใช่ 9:16</span>
          <select id="ro-fit"><option value="pad">ใส่ขอบดำ (เห็นภาพครบ)</option><option value="crop">ครอปให้เต็มจอ</option></select></label>
        <label class="field"><span>เพิ่มความคม</span>
          <select id="ro-sharpen"><option value="off">ปิด</option><option value="light">เบา</option><option value="medium">กลาง</option><option value="strong">แรง</option></select></label>
        <label class="field"><span>ลดรอยแตก/นอยส์</span>
          <select id="ro-denoise"><option value="off">ปิด</option><option value="light">เบา</option><option value="medium">กลาง</option></select></label>
      </div>
    </details>
  </section>

  <!-- Step 4: render -->
  <section class="card hidden" id="step-render">
    <h2><span class="num">4</span> สร้างคลิปชัดพิเศษ</h2>
    <button class="btn primary big" id="btn-render">2. Enhance &amp; ฝังซับ</button>
    <div class="task hidden" id="task-render"><div class="progress"><div></div></div><p class="msg"></p></div>
    <div class="result hidden" id="result">
      <video id="out-video" playsinline controls preload="metadata"></video>
      <a class="btn primary big" id="btn-download" download>⬇️ Download Master MP4</a>
      <p class="meta" id="result-meta"></p>
    </div>
    <details class="log hidden" id="log-box"><summary>ดู log FFmpeg</summary><pre id="log"></pre></details>
  </section>
</main>

<div class="toast hidden" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
